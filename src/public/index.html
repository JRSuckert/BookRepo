<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Library</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>📚 Book Library</h1>
      <div class="header-actions">
        <a href="/opds" class="btn btn-ghost" title="OPDS Feed">OPDS</a>
        <button id="rescanBtn" class="btn btn-ghost" title="Rescan library">⟳ Rescan</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="search" id="searchInput" placeholder="Search books…" autocomplete="off"/>
      </div>
      <div class="sidebar-section-title">Categories</div>
      <ul id="categoryList"></ul>
    </nav>

    <!-- Main content -->
    <main class="content">
      <div id="bookGrid" class="book-grid"></div>
      <p id="emptyMsg" class="empty-msg" hidden>No books found.</p>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
